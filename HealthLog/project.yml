name: HealthLog
options:
  bundleIdPrefix: com.hasini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  HealthLog:
    build:
      targets:
        HealthLog: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  HealthLog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthLog
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Health Log
        # Needed for the optional Face ID lock in Settings.
        NSFaceIDUsageDescription: Unlock your health log.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasini.healthlog
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
