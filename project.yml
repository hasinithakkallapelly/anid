name: Anid
options:
  bundleIdPrefix: com.hasini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Anid:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Anid
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        # Lets Anid check whether Remind Me is installed (UIApplication.canOpenURL)
        # before offering to hand reminders off to it.
        LSApplicationQueriesSchemes:
          - remindme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasini.anid
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
